worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # index.html PWA ini 215 KB dan gzip aman karena teks; font/woff sudah
  # dikompres, jadi upstream tidak di-recompress.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ════ API native ════
    # Express berjalan di 127.0.0.1:8081 dalam container yang sama, sesuai
    # default server/index.js (PORT || 8081). Dipisah supaya Express tidak
    # perlu tahu soal nginx, dan frontend tetap satu origin tanpa CORS.
    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # X-Forwarded-For wajib: gate IP di server/absen.js membaca req.ip, dan
      # tanpa header ini Express melihat 127.0.0.1 sehingga gate selalu lolos.
      # ponytail: kalau ada proxy lain di depan, tambahkan satu hop per proxy
      # yang benar-benar ada, jangan menebak.
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      client_max_body_size 25m;
    }

    # Health check, dipakai load balancer Coolify.
    location = /healthz {
      proxy_pass http://127.0.0.1:8081/api/health;
      access_log off;
    }

    # ════ Statis ════
    # PWA perlu root, bukan dist/: dist/index.html masih merujuk js/lib/*.js
    # sebagai file terpisah tapi folder js/ tidak ikut ter-copy ke dist/.
    # Cache fingerprinted aman diimmutable.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|ico)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # index.html dan service-worker.js tidak boleh di-cache lama, atau pengguna
    # yang pernah menyimpan versi lama akan terus dapat PWA versi lama.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
    location = /service-worker.js {
      add_header Cache-Control "no-cache";
    }

    # Single-page app: path lain dilayani index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ════ Jangan pernah sajikan secret ════
    # Root /usr/share/nginx/html sudah tidak memuat .env, tapi defense in depth:
    # kalau ada .env yang terganti ke dalam image, jangan sampai diekspos.
    location ~ /\. {
      deny all;
      return 404;
    }

    location ~* (\.env|package(-lock)?\.json|\.git/|node_modules/|server/) {
      deny all;
      return 404;
    }
  }
}