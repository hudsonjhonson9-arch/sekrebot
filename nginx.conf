worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Pertahankan X-Forwarded-Proto dari proxy TLS (Coolify/Cloudflare) agar HSTS Express aktif
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers bawaan untuk semua halaman statis (camera & geolocation tetap diizinkan untuk self)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=()" always;

    # ════ API native ════
    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 60s;
      client_max_body_size 25m;
    }

    # Health check, dipakai load balancer Coolify.
    location = /healthz {
      proxy_pass http://127.0.0.1:8081/api/health;
      access_log off;
    }

    # Paket instalasi DevMode Blocker (Android APK & iOS MDM Profile)
    location ~* \.apk$ {
      default_type application/vnd.android.package-archive;
      add_header Content-Disposition       "attachment" always;
      add_header X-Content-Type-Options    "nosniff" always;
      try_files $uri =404;
    }
    location ~* \.mobileconfig$ {
      default_type application/x-apple-aspen-config;
      add_header Content-Disposition       "attachment" always;
      add_header X-Content-Type-Options    "nosniff" always;
      try_files $uri =404;
    }

    # Bukti unggahan lokal (izin/sakit/cuti) dilayani oleh Express dari /app/public/uploads
    location ^~ /uploads/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ════ Statis ════
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|ico|json)$ {
      expires 7d;
      add_header Cache-Control             "public" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control             "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header X-Frame-Options           "SAMEORIGIN" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=()" always;
    }
    location = /login.html {
      add_header Cache-Control             "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header X-Frame-Options           "SAMEORIGIN" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=()" always;
    }

    # Single-page app: path lain dilayani index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Jangan pernah sajikan file rahasia
    location ~ /\. {
      deny all;
      return 404;
    }

    location ~* (\.env|package(-lock)?\.json|\.git/|node_modules/|server/) {
      deny all;
      return 404;
    }
  }
}
