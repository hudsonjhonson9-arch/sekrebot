[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:express]
command=node /app/server/index.js
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Naikkan verbose supaya crash terlihat di log Coolify tanpa perlu exec shell.
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Kalau Express berulang gagal start (mis. env belum ada), jangan diam-diam
; hanya nginx yang tetap jalan dan menjawab 200 untuk halaman statis sementara
; API sudah tidak ada.
[eventlistener:dependson]
command=sh -c "while sleep 10; do if ! nc -z 127.0.0.1 8081; then echo '[supervisor] Express tidak merespons di 8081, memicu restart express'; supervisorctl restart express >/dev/null 2>&1; fi; done"
events=PROCESS_STATE_FATAL